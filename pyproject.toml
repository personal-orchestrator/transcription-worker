[project]
name = "transcription-worker"
version = "0.1.0"
description = "Dedicated transcription worker service for audio processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "groq>=0.18.0",
    "nats-py>=2.15.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = "."

